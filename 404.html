<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SS-StyleS</title>
  <script type="text/javascript">
    // GitHub Pages PWA redirect
    var repoName = 'ss-styles-pwa';
    var l = window.location;
    
    // If accessing PWA paths, redirect to index.html
    if (l.pathname.indexOf('/' + repoName + '/') === 0) {
      var newPath = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + 
                   '/' + repoName + '/index.html';
      window.location.replace(newPath);
    }
  </script>
</head>
<body>
  <h1>Redirecting to SS-StyleS...</h1>
</body>
</html>
